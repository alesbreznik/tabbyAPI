# TabbyAPI Runtime Configuration for DeepSeek-R1-Distill-Qwen-32B (EXL3 4.25 bpw)
# Assigned Port: 50011 (Proxied by Watchdog Broker to Public Port 5001 as local_model_2)
# Device Mapping (CUDA_VISIBLE_DEVICES=0,2):
#   Device 0 = RTX 4080 Super 16GB: ~2.37 GB Target Ingestion Layers Spillover
#   Device 1 = RTX 4000 Ada #2 20GB: ~18.92 GB Target Saturated (95% Full Saturation) + 64k Q4 KV Cache

network:
  host: 127.0.0.1
  port: 50011                      # Proxied by Watchdog Broker to Public Port 5001
  disable_auth: false
  disable_fetch_requests: false
  send_tracebacks: false
  api_servers: ["OAI"]

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false
  log_chat_completion_requests: false

model:
  model_dir: models
  inline_model_loading: false
  use_dummy_models: true
  dummy_model_names:
    - "local_model_2"
    - "deepseek-r1-32b"
    - "DeepSeek-R1-Distill-Qwen-32B-exl3-4.25bpw"
    - "reasoner-verifier"
    - "r1-32b"

  model_name: DeepSeek-R1-Distill-Qwen-32B-exl3-4.25bpw
  backend: exllamav3

  # Context Architecture: 64k Context with 4-bit (4,4) Q4 KV Cache (Zero OOM, 19GB Ada Saturation)
  max_seq_len: 32768
  cache_size: 32768
  cache_mode: "8,4"
  chunk_size: 1024
  output_chunking: true
  max_batch_size: 1

  # Memory Split across visible devices (Device 0 = 4080S, Device 1 = Ada 4000 #2)
  tensor_parallel: false
  gpu_split_auto: false
  gpu_split: [3.7, 0.0, 20.0]

  # Chat & Structured Reasoning Extraction
  prompt_template: chatml.jinja
  reasoning: true
  reasoning_start_token: "<think>"
  reasoning_end_token: "</think>"
  start_in_reasoning: auto
  tool_calls_in_reasoning: true

  # Native Multi-Turn Reasoning & Thinking Preservation
  template_vars_default:
    enable_thinking: true
    preserve_thinking: true
    reasoning_effort: "high"

  use_as_default:
    - max_seq_len
    - cache_mode
    - chunk_size
    - prompt_template
    - reasoning
    - template_vars_default

# Speculative N-Gram Decoding Engine (0 VRAM overhead, ~1.4x TPS acceleration)
draft_model:
#  draft_mode: ngram
#  ngram_match_min: 2
#  draft_num_tokens: 3
  draft_mode: model
  draft_model_dir: models
  draft_model_name: DeepSeek-R1-Distill-Qwen-1.5B-exl3-5.0bpw
  draft_cache_mode: "Q8"
  draft_num_tokens: 3
  draft_gpu_split: [2.2, 0.0, 0.0]

sampling:
  override_preset: deepseek_r1_reasoning

memory:
  cuda_malloc_async: true

developer:
  unsafe_launch: false
  disable_request_streaming: false
  realtime_process_priority: true
  log_level: INFO
