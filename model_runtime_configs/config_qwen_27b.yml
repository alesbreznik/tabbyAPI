# TabbyAPI Runtime Configuration for Qwen3.6-27B-4.50bpw-exl3 (65k Context @ Q6)
# Target: GPU 1 (NVIDIA RTX 4000 Ada - 20 GB VRAM @ 360 GB/s)

network:
  host: 127.0.0.1
  port: 5001
  disable_auth: false
  disable_fetch_requests: false
  send_tracebacks: false
  api_servers: ["OAI"]

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false
  log_chat_completion_requests: false

model:
  model_dir: models
  inline_model_loading: false
  use_dummy_models: true
  dummy_model_names:
    - "gpt-3.5-turbo"
    - "qwen-27b"
    - "tabby_qwen_27b"
    - "gemma-4-26B-A4B-it-exl3-5.10bpw"
    - "gemma-4-26B-A4B-it-exl3"
    - "gemma-4-26b"
    - "gemma-4-26b-it"
    - "local_reasoning"
  
  # Model Target: Qwen 27B Dense EXL3
  model_name: Qwen3.6-27B-4.50bpw-exl3
  backend: exllamav3
  
  # Doubled Context Bounds (65,536 tokens with Q6 KV Cache)
  max_seq_len: 65536
  cache_size: 65536
  cache_mode: 6,6
  output_chunking: true
  
  # Throughput & Prefill Optimization for RTX 4000 Ada (48MB L2 Cache)
  chunk_size: 4096
  max_batch_size: 2
  fast_safetensors: true
  
  # Single GPU 1 Isolation
  tensor_parallel: false
  tensor_parallel_backend: native
  gpu_split_auto: false
  autosplit_reserve: []
  gpu_split: []
  
  # RoPE Scaling (Native 1.0)
  rope_scale: 1.0
  rope_alpha: 1.0
  
  # Prompt Template (ChatML formatting for Qwen)
  prompt_template: chatml
  
  # Structured Chain-of-Thought & Reasoning Extraction
  reasoning: true
  reasoning_start_token: "<think>"
  reasoning_end_token: "</think>"
  start_in_reasoning: auto
  tool_calls_in_reasoning: true
  
  # Native Chat Template & Multi-Turn Reasoning Preservation
  template_vars_default:
    enable_thinking: true
    preserve_thinking: true
    reasoning_effort: "xhigh"
  
  use_as_default:
    - max_seq_len
    - cache_mode
    - chunk_size
    - prompt_template
    - reasoning
    - template_vars_default

draft_model:
  # N-gram speculative decoding for fast AST and JSON syntax generation
  draft_mode: ngram
