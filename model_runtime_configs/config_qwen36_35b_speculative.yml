# TabbyAPI Runtime Configuration for Qwen3.6-35B-A3B EXL3 (5.60 bpw) + Qwen2.5-Coder-1.5B Q8 Drafter
# Architecture: Hybrid Linear Attention (30 Gated DeltaNet + 10 Gated Attention) + 256-Expert MoE (~3.0B Active)
# Asymmetric VRAM Allocation:
#   GPU 0 (RTX 4080 Super 16GB @ 736 GB/s): 100% Pinned Drafter (2.2 GB) + Drafter KV (0.8 GB) + Target Slice (5.0 GB) + Target KV Share (1.8 GB) + Display/OS (2.8 GB) = 12.60 GB / 16.00 GB
#   GPU 1 (RTX 4000 Ada 20GB @ 360 GB/s): Target Body (14.8 GB) + Full 128k FP8 KV Pool (4.6 GB) + ECC/Driver (0.55 GB) = 19.95 GB / 20.00 GB (99.75% Saturation • Zero OOM)

network:
  host: 127.0.0.1
  port: 50010                      # Proxied by Watchdog Broker to Public Ports 5000 & 5001
  disable_auth: false
  disable_fetch_requests: false
  send_tracebacks: false
  api_servers: ["OAI"]

logging:
  log_prompt: false
  log_generation_params: false
  log_requests: false
  log_chat_completion_requests: false

model:
  model_dir: models
  inline_model_loading: false
  use_dummy_models: false
  dummy_model_names:
    - "gpt-3.5-turbo"
    - "qwen3.6-35b"
    - "Qwen3.6-35B-A3B"
    - "Qwen3.6-35B-A3B-EXL3-5.6bpw"
    - "Qwen3.6-35B-A3B-exl3-5.0bpw"
    - "Hermes-3-Llama-3.1-8B-exl3-6.0bpw"
    - "hermes-3-8b"
    - "gemma-4-26B-A4B-it-exl3"
    - "gemma-4-26b"
    - "local_fast"
    - "local_smart"
    - "local_reasoning"
    - "local_triage"
    - "coding_llm"

  # Target MoE Engine
  model_name: Qwen3.6-35B-A3B-exl3-5.0bpw
  backend: exllamav3

  # Context & Attention Architecture (128k FP8 Quantized KV Cache)
  max_seq_len: 131072
  cache_size: 131072
  cache_mode: "8,8"
  chunk_size: 2048
  output_chunking: true
  max_batch_size: 2

  # Asymmetric VRAM Allocation across GPUs
  tensor_parallel: false
  gpu_split_auto: false
  gpu_split: [6.5, 20.0]           # Target model: GPU 0 up to 6.5 GB (accommodates 1.6GB MTP + 7 trunk modules) | GPU 1 up to 20.0 GB (35 modules, Max Ada Saturation)

  # RoPE Scaling
  rope_scale: 1.0
  rope_alpha:

  # Prompt Template (auto-detects Jinja chat template)
  prompt_template: qwen3.jinja
  vision: true

  # Structured Chain-of-Thought & Reasoning Extraction
  reasoning: true
  reasoning_start_token: "<think>"
  reasoning_end_token: "</think>"
  start_in_reasoning: auto
  tool_calls_in_reasoning: true
  tool_format: "qwen3_coder"

  # Native Multi-Turn Reasoning & Thinking Preservation
  template_vars_default:
    enable_thinking: true
    preserve_thinking: true
    reasoning_effort: "xhigh"

  use_as_default:
    - max_seq_len
    - cache_mode
    - chunk_size
    - prompt_template
    - reasoning
    - template_vars_default

# Speculative Decoding Engine (Native Multi-Token Prediction MTP Head)
draft_model:
  draft_mode: mtp
  draft_num_tokens: 3
  draft_cache_mode: "Q8"

memory:
  cuda_malloc_async: true
  sysmem_recurrent_cache: 4096

developer:
  unsafe_launch: false
  disable_request_streaming: false
  realtime_process_priority: true
  log_level: INFO
